name: Godot and Worker tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  godot:
    name: Godot 4.7.2 contracts and Web export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
      - name: Import project
        run: godot --headless --path . --editor --quit
      - name: Run Godot contract tests
        run: |
          godot --headless --path . --script tests/player_skin_contract_test.gd
          godot --headless --path . --script tests/test_dots_companion.gd
          godot --headless --path . --script tests/test_dots_dialogue.gd
          godot --headless --path . --script tests/test_dots_variants.gd
          godot --headless --path . --script tests/test_fort_mason_stage.gd
          godot --headless --path . --script tests/test_controls_hint.gd
          godot --headless --path . --script tests/test_game_progress.gd
          godot --headless --path . --script tests/test_dots_decision_client.gd
          godot --headless --path . --script tests/test_dots_interaction.gd
          godot --headless --path . --script tests/test_fort_mason_lighting.gd
          godot --headless --path . --script tests/test_gameplay_scale.gd
          godot --headless --path . --script tests/test_gameplay_movement.gd
          godot --headless --path . --script tests/test_gameplay_camera.gd
          godot --headless --path . --script tests/test_pause_menu.gd
      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html

  worker:
    name: Decisions Worker contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Worker tests
        run: node --test backend/worker.test.mjs

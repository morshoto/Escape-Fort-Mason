name: Public Web smoke

on:
  pull_request:
    paths:
      - ".github/workflows/public-web-smoke.yml"
      - "tools/smoke_web_assets.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-assets:
    name: GitHub Pages assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check smoke script syntax
        run: bash -n tools/smoke_web_assets.sh
      - name: Check published Godot assets
        run: bash tools/smoke_web_assets.sh

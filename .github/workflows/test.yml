name: Godot tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run headless tests
        run: bash tests/run-tests.sh
